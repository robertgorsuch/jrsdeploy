name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan full history, not just the tip
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Offline skill checks on both OSes: doc/link consistency + Pester unit tests.
  # The ubuntu leg runs under pwsh and is what backs the cross-platform claim
  # in SKILL.md - if a script regresses to Windows-only syntax, this leg fails.
  skill-checks:
    name: jasper-deploy offline checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Doc/link consistency (check_docs.ps1)
        shell: pwsh
        run: |
          & ./plugins/jasper-deploy/skills/jasper-deploy/scripts/check_docs.ps1
          if ($LASTEXITCODE) { throw "skill docs are stale (broken link / missing script / stale count)" }
      - name: Pester unit tests
        shell: pwsh
        run: |
          # Tests use legacy Pester 3.x `Should Be` syntax (local dev machines run
          # the Windows-bundled 3.4.0). Runners preinstall Pester 5, which dropped
          # that syntax - pin Pester 4, which accepts it and runs on pwsh/Linux.
          Install-Module Pester -RequiredVersion 4.10.1 -Force -Scope CurrentUser -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 4.10.1
          $tests = "./plugins/jasper-deploy/skills/jasper-deploy/tests"
          if (Test-Path $tests) {
            Invoke-Pester -Path $tests -EnableExit
          } else {
            Write-Host "no tests directory - skipping"
          }
      - name: Python unit tests (scaffold_jrxml dialect checks)
        shell: pwsh
        run: |
          # Plain unittest (no pytest dependency); offline, no psql needed.
          $skill = "./plugins/jasper-deploy/skills/jasper-deploy"
          Push-Location $skill
          try { python -m unittest -v tests/test_scaffold_jrxml.py } finally { Pop-Location }
          if ($LASTEXITCODE) { throw "python unit tests failed" }
      - name: Plugin manifest sanity
        shell: pwsh
        run: |
          $mp = Get-Content ./.claude-plugin/marketplace.json -Raw | ConvertFrom-Json
          $pl = Get-Content ./plugins/jasper-deploy/.claude-plugin/plugin.json -Raw | ConvertFrom-Json
          if ($mp.plugins[0].source -ne "./plugins/jasper-deploy") { throw "marketplace source drifted: $($mp.plugins[0].source)" }
          if (-not (Test-Path "./plugins/jasper-deploy/skills/jasper-deploy/SKILL.md")) { throw "SKILL.md missing from plugin payload" }
          Write-Host "plugin $($pl.name) v$($pl.version) manifest OK"
